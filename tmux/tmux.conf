# devkit tmux config
# Usage: symlink to ~/.tmux.conf or source from it
#   ln -sf ~/devkit/tmux/tmux.conf ~/.tmux.conf

# Alt+number to switch windows (no prefix needed)
bind -n M-1 select-window -t 0
bind -n M-2 select-window -t 1
bind -n M-3 select-window -t 2
bind -n M-4 select-window -t 3
bind -n M-5 select-window -t 4
bind -n M-6 select-window -t 5
bind -n M-7 select-window -t 6

# Mouse support (scroll, click to switch windows)
set -g mouse on

# Start window numbering at 0
set -g base-index 0

# Increase scrollback
set -g history-limit 10000

# Status bar styling
set -g status-style 'bg=colour235 fg=colour250'
set -g window-status-format '  #W  '
set -g window-status-current-format '#[fg=colour2,bold] [#W] '
set -g status-left '#[fg=colour4,bold] tmux '
set -g status-right ''
